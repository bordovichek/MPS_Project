[project]
name = "mps-project"
version = "2.0.0"
description = "Каталог самолётов и аэропортов с построением маршрутов с учётом дальности полёта"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["*/migrations/0*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "DJ", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "RUF012"]

[tool.ruff.lint.isort]
known-first-party = ["MPS_Project", "api", "core", "web"]
